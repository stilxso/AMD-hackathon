services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Named volume, so registered accounts survive a rebuild.
      DB_PATH: /data/airq.db
    volumes:
      - airq-db:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./airq
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  airq-db:
